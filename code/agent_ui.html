<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenECRS · AI Opportunity Radar</title>
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="64x64" href="/assets/favicon-64.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  :root{
    --bg:#f6f7f8; --panel:#ffffff; --ink:#111214; --muted:#6b7078; --faint:#9aa0a6;
    --line:#e6e7e9; --line-strong:#d7d9dc; --soft:#f2f3f4;
    --accent:#111214; --accent-ink:#ffffff; --link:#2f6feb;
    --radius:16px; --radius-sm:10px;
    --font:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;cursor:pointer}
  .app{display:flex;height:100vh;overflow:hidden}

  /* ---------------- sidebar ---------------- */
  .side{width:292px;flex:0 0 292px;transition:width .18s ease,flex-basis .18s ease;background:#fbfbfa;display:flex;flex-direction:column;padding:18px 14px 14px}
  .brand{display:flex;align-items:center;gap:9px;padding:0 4px 16px}
  .mark{width:26px;height:26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;letter-spacing:.03em}
  .brand-name{font-weight:600;font-size:14px;letter-spacing:.01em}
  .brand-sub{font-size:10.5px;color:var(--faint);margin-top:0}
  .newchat{display:flex;align-items:center;gap:7px;width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:var(--radius-sm);background:var(--panel);font-weight:500;transition:.15s}
  .newchat:hover{background:var(--soft)}
  .side-scroll{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .side-label{font-size:11px;color:var(--faint);letter-spacing:.08em;margin:20px 6px 7px;text-transform:uppercase}
  .history{display:flex;flex-direction:column;gap:1px}
  .history button{text-align:left;padding:6px 8px;border-radius:8px;color:#3c4045;font-size:12px;line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .history button:hover{background:var(--soft);color:var(--ink)}
  .history button.active{background:var(--soft);color:var(--ink);font-weight:500}
  .quick{display:flex;flex-direction:column;gap:1px}
  .quick button{text-align:left;padding:7px 9px;border-radius:8px;color:#3c4045;font-size:13px;line-height:1.45;transition:.12s}
  .quick button:hover{background:var(--soft);color:var(--ink)}
  .scen{display:flex;flex-direction:column;gap:1px;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .scen button{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;text-align:left;color:#3c4045;font-size:12px;transition:.12s}
  .scen button:hover{background:var(--soft);color:var(--ink)}
  .scen .rk{font-family:var(--mono);font-size:10.5px;color:var(--faint);min-width:16px;text-align:right}
  .scen .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scen .sc{font-family:var(--mono);font-size:10.5px;color:var(--faint)}
  .side-foot{margin-top:auto;padding:12px 6px 0;border-top:1px solid var(--line);font-size:11px;color:var(--faint);line-height:1.7}
  .side-foot b{color:var(--muted);font-weight:500}

  /* ---------------- main ---------------- */
  .main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  .topbar{height:58px;flex:0 0 58px;display:flex;align-items:center;gap:10px;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.82);backdrop-filter:blur(10px);z-index:5;overflow:hidden}
  .topbar .title{font-weight:600;font-size:14px}
  .topbar .sub{color:var(--faint);font-size:11.5px;margin-left:2px}
  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border:1px solid var(--line);border-radius:999px;font-size:11px;color:var(--muted);background:var(--panel)}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:#9aa0a6}
  .pill.llm{border-color:#cfe8d9;background:#f4fbf6;color:#1b6b45}
  .pill.llm .dot{background:#22a06b}
  .icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);transition:.15s;color:#3c4045}
  .icon-btn:hover{background:var(--soft)}
  .icon-btn svg{width:16px;height:16px}
  .icon-btn.ghost{border:none;background:transparent;color:var(--faint)}
  .icon-btn.ghost:hover{background:var(--soft);color:var(--ink)}
  .lang-switch{display:flex;border:1px solid var(--line-strong);border-radius:9px;overflow:hidden;margin-right:2px}
  .lang-switch button{padding:6px 9px;font-size:11.5px;color:var(--muted);background:var(--panel);line-height:1}
  .lang-switch button.active{background:var(--ink);color:#fff}
  .modal{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal[hidden]{display:none}
  .modal-mask{position:absolute;inset:0;background:rgba(17,18,20,.3)}
  .modal-card{position:relative;width:min(560px,100%);max-height:calc(100vh - 48px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:24px 26px;box-shadow:0 24px 64px rgba(17,18,20,.18)}
  .modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:10px}
  .modal-head b{font-size:16px}
  .modal-sub{margin-left:8px;font-size:11px;color:var(--faint)}
  .modal-desc{color:var(--muted);font-size:12.5px;line-height:1.8;margin:0 0 18px}
  .field{display:block;margin:0 0 14px}
  .field > span{display:block;font-size:12px;color:#3c4045;margin-bottom:6px}
  .field input{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:9px 11px;font-family:var(--font);font-size:13px;color:var(--ink);background:#fff;outline:none}
  .field input:focus{border-color:#b9bdc3}
  .field-hint{display:block;font-size:11px;color:var(--faint);margin-top:5px}
  .switch-row{display:flex;align-items:center;gap:9px;cursor:pointer;margin:6px 0 20px;font-size:12.5px;color:#3c4045}
  .switch-row input{display:none}
  .switch{width:34px;height:20px;border-radius:999px;background:#d7d9dc;position:relative;transition:.18s;flex:0 0 34px}
  .switch:after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.15)}
  .switch-row input:checked + .switch{background:#111214}
  .switch-row input:checked + .switch:after{transform:translateX(14px)}
  .switch-label{color:var(--muted)}
  .modal-actions{display:flex;gap:10px;justify-content:flex-end}
  .test-result{margin-top:12px;font-size:12px;line-height:1.7;min-height:18px;color:var(--muted)}
  .test-result.ok{color:#1b6b45}
  .test-result.err{color:#b3261e}
  .modal-foot{font-size:11px;color:var(--faint);line-height:1.7;margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px}
  .modal-foot code{font-family:var(--mono);font-size:10.5px;background:var(--soft);padding:1px 4px;border-radius:4px}
  .eng-tag{display:inline-flex;align-items:center;border:1px solid #cfe8d9;background:#f4fbf6;color:#1b6b45;border-radius:999px;padding:1px 7px;font-size:10.5px}
  .eng-tag.rule{border-color:var(--line);background:var(--soft);color:var(--muted)}
  .llm-warn{margin:14px 0 0;padding:9px 12px;border-radius:10px;background:#fff8f4;border:1px solid #f3ddcf;color:#8a4b22;font-size:11.5px;line-height:1.7}
  .top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}
  .btn{padding:7px 12px;border-radius:9px;border:1px solid var(--line-strong);background:var(--panel);font-size:12.5px;transition:.15s;white-space:nowrap}
  .btn:hover{background:var(--soft)}
  .btn.primary{background:var(--ink);color:var(--accent-ink);border-color:var(--ink)}
  .btn.primary:hover{opacity:.88}
  .btn:disabled{opacity:.45;cursor:default}
  .menu-btn{display:none}

  .thread{flex:1;overflow-y:auto;padding:38px 26px 10px;scroll-behavior:smooth}
  .thread-inner{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:34px;padding-bottom:14px}
  .thread-inner.empty{justify-content:center;min-height:100%}

  /* ---------------- messages ---------------- */
  .msg{display:flex;gap:12px;align-items:flex-start}
  .msg.user{justify-content:flex-end}
  .avatar{width:26px;height:26px;flex:0 0 26px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:600;letter-spacing:.03em;margin-top:2px}
  .avatar-logo{background:url('/assets/logo-mark.png') center/contain no-repeat;background-color:transparent;color:transparent;border-radius:8px}
  .web-pill{gap:5px;cursor:pointer;color:var(--muted)}
  .web-pill svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  .web-pill.on{border-color:#c9e3d3;background:#f2fbf5;color:#1b6b45}
  .web-pill.on svg{stroke:#1b6b45}
  .web-setting{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px;border:1px solid var(--line);border-radius:12px;margin:6px 0 14px}
  .web-copy b{display:block;font-size:12.5px;color:var(--ink);font-weight:500}
  .web-copy span{display:block;font-size:11px;color:var(--faint);line-height:1.65;margin-top:3px;max-width:360px}
  .switch2{position:relative;width:38px;height:22px;flex:0 0 auto;margin-top:2px;cursor:pointer}
  .switch2 input{position:absolute;opacity:0;width:0;height:0}
  .switch2 span{position:absolute;inset:0;background:var(--line-strong);border-radius:999px;transition:.15s}
  .switch2 span:before{content:'';position:absolute;width:16px;height:16px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .switch2 input:checked+span{background:#111214}
  .switch2 input:checked+span:before{transform:translateX(16px)}
  .web-list{display:flex;flex-direction:column;gap:6px}
  .web-item{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);text-decoration:none}
  .web-item:hover{background:var(--soft);border-color:var(--line-strong)}
  .web-title{font-size:12.5px;color:var(--ink);line-height:1.5}
  .web-url{font-size:10px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .web-snip{font-size:11px;color:var(--muted);line-height:1.6}
  .settings-tabs{display:flex;gap:4px;background:var(--soft);border-radius:10px;padding:4px;margin:0 0 16px}
  .settings-tabs button{flex:1;padding:7px 10px;border-radius:7px;font-size:12px;color:var(--muted)}
  .settings-tabs button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .settings-select{width:100%;padding:9px 11px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);font-size:12.5px;color:var(--ink)}
  .bubble{max-width:78%;background:var(--ink);color:#fff;padding:11px 15px;border-radius:16px 16px 4px 16px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
  .msg-body{flex:1;min-width:0}
  .msg-head{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--faint);margin:0 0 10px 2px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px 30px;box-shadow:0 10px 30px rgba(17,18,20,.035)}
  .tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
  .tw table{min-width:520px}
  .card .kicker{font-size:10.5px;letter-spacing:.1em;color:var(--faint);text-transform:uppercase;margin:0 0 12px}
  .advice{border-left:3px solid var(--ink);padding:3px 0 3px 16px;font-size:16px;line-height:1.8;font-weight:600;letter-spacing:-.005em}
  .reply{color:var(--muted);font-size:13px;line-height:1.75;margin:15px 0 0}
  .reply b{color:var(--ink);font-weight:600}

  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px;margin:22px 0 6px}
  .stat{background:var(--soft);border-radius:12px;padding:13px 15px}
  .stat .lb{font-size:11px;color:var(--faint)}
  .stat .vl{font-size:19px;font-weight:600;font-family:var(--mono);letter-spacing:-.02em;margin-top:1px;font-variant-numeric:tabular-nums}
  .stat .vl small{font-size:11px;color:var(--faint);font-weight:400;font-family:var(--font);margin-left:2px}

  .sec{margin:28px 0 0}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#3c4045;margin:0 0 12px}
  .sec-title:after{content:"";flex:1;height:1px;background:var(--line)}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:11px;color:var(--faint);font-weight:500;background:transparent;border-bottom:1px solid var(--line-strong)}
  td.num,th.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px}
  tr:last-child td{border-bottom:none}
  td.name{font-weight:500}
  .tag{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:1px}
  .best td{background:#fbfbfc}

  .ev{margin:0;padding:0;list-style:none}
  .ev li{padding:15px 0;border-bottom:1px dashed var(--line)}
  .ev li:last-child{border-bottom:none}
  .ev .meta{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--faint);flex-wrap:wrap}
  .ev .src{border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--muted);background:#fafafa}
  .ev .ttl{font-weight:600;font-size:13px;margin:3px 0 4px}
  .ev blockquote{margin:0;padding:7px 11px;background:var(--soft);border-left:2px solid var(--line-strong);border-radius:0 8px 8px 0;color:#2c3035;font-size:12.5px;line-height:1.65}
  .ev .url{font-size:10.5px;color:var(--faint);word-break:break-all;margin-top:3px}
  .more{font-size:12px;color:var(--muted);margin-top:8px}
  .more:hover{color:var(--ink);text-decoration:underline}

  .actions{margin:10px 0 0;padding-left:18px;font-size:13px;line-height:1.75;color:#2c3035}
  .actions li{margin:8px 0}
  .risk{font-size:11.5px;color:var(--faint);margin:20px 0 0;padding-top:14px;border-top:1px solid var(--line);line-height:1.75}

  .msg-actions{display:flex;align-items:center;gap:10px;margin-top:22px;flex-wrap:wrap}
  .follow{margin:20px 0 0;display:flex;gap:9px;flex-wrap:wrap}
  .chip{padding:8px 14px;border:1px solid var(--line-strong);border-radius:999px;font-size:12px;color:#3c4045;background:var(--panel);transition:.14s}
  .chip:hover{background:var(--soft);border-color:var(--line-strong);color:var(--ink)}

  /* ---------------- composer ---------------- */
  .composer-wrap{flex:0 0 auto;padding:10px 22px 18px;background:linear-gradient(180deg,rgba(246,247,248,0),var(--bg) 26%)}
  .composer{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line-strong);border-radius:18px;padding:12px 14px 10px;box-shadow:0 6px 24px rgba(17,18,20,.05)}
  .composer:focus-within{border-color:#c9ccd1;box-shadow:0 6px 28px rgba(17,18,20,.07)}
  .chips{display:flex;gap:9px;flex-wrap:wrap;margin:0 0 12px;min-height:0}
  textarea{width:100%;border:none;outline:none;resize:none;background:transparent;font-family:var(--font);font-size:14px;line-height:1.6;color:var(--ink);max-height:150px;padding:2px 2px}
  textarea::placeholder{color:var(--faint)}
  .input-row{display:flex;align-items:flex-end;gap:10px}
  .clear-input{flex:0 0 auto;width:26px;height:26px;border-radius:7px;color:var(--faint);font-size:14px;align-self:center}
  .clear-input:hover{background:var(--soft);color:var(--ink)}
  .msg.user{position:relative}
  .copy-user{position:absolute;right:6px;bottom:3px;width:20px;height:18px;border-radius:5px;color:var(--faint);font-size:11px;opacity:.45;transition:.15s;background:var(--panel)}
  .msg.user:hover .copy-user{opacity:1}
  .copy-user:hover{background:var(--line);color:var(--ink)}
  .attach-btn{flex:0 0 auto;width:36px;height:36px;border-radius:9px}
  .attach-btn svg{width:16px;height:16px}
  .attach-chip{display:flex;align-items:center;gap:7px;margin:0 0 8px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--soft);font-size:11.5px;color:var(--muted)}
  .attach-chip[hidden]{display:none}
  .attach-ico{color:var(--faint)}
  .attach-name{color:var(--ink);max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .attach-meta{color:var(--faint);font-size:10.5px}
  .attach-remove{margin-left:auto;width:20px;height:20px;border-radius:5px;color:var(--faint);font-size:13px}
  .attach-remove:hover{background:var(--line);color:var(--ink)}
  .model-pick{position:relative;flex:0 0 auto}
  .composer-model{display:inline-flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--line-strong);border-radius:9px;background:var(--panel);font-size:11.5px;color:var(--muted);max-width:170px}
  .composer-model:hover{background:var(--soft)}
  .composer-model span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:138px}
  .composer-model svg{flex:0 0 auto;color:var(--faint)}
  .composer-menu{top:auto;bottom:calc(100% + 10px);right:0}
  .send{width:36px;height:36px;flex:0 0 36px;border-radius:12px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;transition:.15s}
  .send:hover{opacity:.86}
  .send:disabled{opacity:.35}
  .send svg{width:17px;height:17px}
  .hint{max-width:820px;margin:11px auto 0;text-align:center;font-size:10.5px;color:var(--faint)}

  /* ---------------- states ---------------- */
  .typing{display:flex;gap:4px;align-items:center;padding:4px 0}
  .typing i{width:6px;height:6px;border-radius:50%;background:#c4c7cb;animation:blink 1.2s infinite}
  .typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
  @keyframes blink{0%,80%,100%{opacity:.3}40%{opacity:1}}
  .error{border-color:#f0c9c9;background:#fffafa}
  .error .advice{border-color:#c0392b}
  .muted-link{color:var(--link);text-decoration:none}
  .muted-link:hover{text-decoration:underline}

  .welcome h3{margin:0 0 14px;font-size:19px;line-height:1.5;letter-spacing:-.012em}
  .welcome p{margin:0 0 24px;color:var(--muted);font-size:13px;line-height:1.85;max-width:660px;text-wrap:pretty}
  .welcome .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin:30px 0 6px}
  .welcome .g{background:var(--soft);border-radius:14px;padding:20px 22px}
  .welcome .gi{width:32px;height:32px;border-radius:9px;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink);margin-bottom:14px}
  .welcome .gi svg{width:15px;height:15px}
  .welcome .g b{font-size:13px;display:block;margin-bottom:7px}
  .welcome .g span{font-size:12px;line-height:1.75;color:var(--muted);text-wrap:pretty}

  .offline-bar{padding:9px 22px;background:#fff8f1;border-bottom:1px solid #f0d9c4;color:#8a4b22;font-size:12px;line-height:1.6}
  .offline-bar a{color:#8a4b22;text-decoration:underline}
  .onboard{display:flex;align-items:center;gap:12px;padding:10px 22px;background:#fff8f1;border-bottom:1px solid #f0d9c4;color:#8a4b22;font-size:12.5px;line-height:1.6}
  .onboard[hidden]{display:none}
  .onboard #onboardText{flex:1}
  .onboard .btn{margin-left:auto;flex:0 0 auto}
  .tabs{display:flex;gap:6px;background:var(--soft);border-radius:10px;padding:4px;margin:0 0 18px}
  .tabs button{flex:1;padding:8px 10px;border-radius:8px;font-size:12.5px;color:var(--muted)}
  .tabs button.active{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  || (SUPPORTED_LANGS.includes(localStorage.getItem('openecrs-lang')) ? localStorage.getItem('openecrs-lang') : 'system');

function resolveSystemLang(){
  const nav = (navigator.language || 'en').toLowerCase();
  if (nav.startsWith('zh')) return 'zh';
  if (nav.startsWith('ja')) return 'ja';
  if (nav.startsWith('es')) return 'es';
  return 'en';
}

  const q = new URLSearchParams(location.search).get('lang');
  if (SUPPORTED_LANGS.includes(q)) return q;
  return LANG_PREF === 'system' ? resolveSystemLang() : LANG_PREF;
})();

async function copyText(text){
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (err) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed'; ta.style.left = '-9999px';
      document.body.appendChild(ta); ta.focus(); ta.select();
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    } catch (e) { return false; }
  }
}

function esc(s){return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmt(v, d=2){const n = Number(v); return Number.isFinite(n) ? n.toFixed(d) : '—';}
function pct(v){const n = Number(v); return Number.isFinite(n) ? (n*100).toFixed(1) + '%' : '—';}
function now(){const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');}
function scrollBottom(smooth=true){thread.scrollTo({top: thread.scrollHeight, behavior: smooth ? 'smooth' : 'auto'});}

async function fetchJSON(url, options, timeoutMs = 150000){
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeoutMs);
  try {
    const res = await fetch(url, Object.assign({}, options, {signal: controller.signal}));
    const data = await res.json();
    return {res, data};
  } finally {
    clearTimeout(timer);
  }
}

function showOffline(message){
  const bar = $('offlineBar');

}

function modelMeta(p){

let menuAnchor = null;

function openModelMenu(anchor){
  if (!$('modelMenu').hidden && menuAnchor === anchor) { closeModelMenu(); return; }
  menuAnchor = anchor;
  renderModelMenu();
  const menu = $('modelMenu');
  menu.hidden = false;
  const rect = anchor.getBoundingClientRect();
  const mw = menu.offsetWidth || 330;
  const mh = menu.offsetHeight || 240;
  const left = Math.min(Math.max(8, rect.right - mw), window.innerWidth - mw - 8);
  let top = rect.top - mh - 10;
  if (top < 8) top = Math.min(rect.bottom + 10, window.innerHeight - mh - 8);
  menu.style.left = left + 'px';
  menu.style.top = Math.max(8, top) + 'px';
}

function closeModelMenu(){ const menu = $('modelMenu'); if (menu) menu.hidden = true; menuAnchor = null; }

let toastTimer = null;
function showToast(text){
  const el = $('toast');
  if (!el) return;
  el.textContent = text;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2200);
}

async function switchProfile(profileId){
  try {
    const res = await fetch('/api/active', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profile_id: profileId})});
    const data = await res.json();
    if (!res.ok || data.error) { showToast(t('switchFailed') + (data.error || res.status)); return; }
    SETTINGS = data;
    updateEnginePill();
    closeModelMenu();
    showToast((SETTINGS.ready ? '' : t('needsSetup') + ' · ') + SETTINGS.name);
    if (!SETTINGS.ready) openSettings(false);
  } catch (err) { showToast(t('switchFailed') + err.message); }
}

function traceBlock(a){
  const trace = a.trace || [];
  if (!trace.length) return '';
  const steps = trace.map(step => {
    if (step.step === 'plan') {
      return `<li><b>${t('tracePlan')}</b> · intent <code>${esc(step.intent)}</code> · scenarios ${esc((step.scenarios || []).join(', ') || '—')} · model <code>${esc(step.model || '')}</code> · ${step.latency_ms || 0} ms</li>`;
    }
    if (step.step === 'tools') {
      const calls = (step.calls || []).map(c => `<code>${esc(c.name)}(${esc(JSON.stringify(c.args || {}))})</code>`).join(' ');
      return `<li><b>${t('traceTools')}</b> ${calls || '—'}</li>`;
    }
    return `<li><b>${t('traceAnswer')}</b> · model <code>${esc(step.model || '')}</code> · ${step.latency_ms || 0} ms</li>`;
  }).join('');
  return `<details class="trace"><summary>${t('traceTitle')} · ${esc((a.engine || {}).label || '')}</summary><ol>${steps}</ol></details>`;
}

function renderAnswer(a, restore){
  const names = a.scenarios || [];
  const single = names.length === 1 ? (a.metrics || {})[names[0]] : null;
  const eng = a.engine || {};
  const label = eng.label || (eng.backend === 'local' ? t('engineLocal') + (eng.model || '') : t('engineApi') + (eng.model || ''));
  const engTag = `<span class="eng-tag">${esc(label)}</span>`;
  let html = `<div class="msg assistant"><div class="avatar avatar-logo" aria-hidden="true"></div><div class="msg-body">
    <div class="msg-head">OpenECRS · ${esc(a.heading || t('answer'))} · ${now()} ${engTag}</div>
    <div class="card">`;
  if (a.kind === 'smalltalk' || a.kind === 'general') {
    html += `<div class="reply" style="margin:0;color:var(--ink);font-size:14px">${esc(a.advice)}</div>`;
    if (a.reply) html += `<p class="reply">${esc(a.reply)}</p>`;
  } else {
    html += `<div class="kicker">${t('kicker')}</div><div class="advice">${esc(a.advice)}</div>`;
    if (a.reply) html += `<p class="reply">${esc(a.reply)}</p>`;
  }
  if (single) html += statsTiles(single);
  if (names.length === 2 && a.metrics) {
    html += `<div class="stats">${names.map(n => {
      const m = a.metrics[n] || {};
      const lbl = LANG === 'zh' ? `${esc(n)} · 机会分` : `${esc(n)} · opportunity`;
      return `<div class="stat"><div class="lb">${lbl}</div><div class="vl">${fmt(m.opportunity,1)}</div></div>`;
    }).join('')}</div>`;
  }
  if (a.ranking && a.ranking.length) html += rankingTable(a.ranking);
  if (a.comparison && a.comparison.length) html += comparisonTable(a.comparison);
  if (single) html += metricsTable(single);
  if (a.evidence && a.evidence.length) html += evidenceList(a.evidence);
  if (a.videos && a.videos.length) html += videoList(a.videos);
  if ((a.web && a.web.length) || a.web_error) html += webList(a.web || [], a.web_note, a.web_error, a.web_query);
  if (a.kind !== 'smalltalk' && a.kind !== 'general') {
    if (a.actions && a.actions.length) html += actionList(a.actions, t('actionsTitle'));
    if (a.risks && a.risks.length) html += actionList(a.risks, t('risksTitle'));
  }
  html += traceBlock(a);
  if (a.kind !== 'smalltalk' && a.kind !== 'general') {
    html += `<div class="msg-actions">
        <button class="btn primary" data-pdf>${t('exportBrief')}</button>
        <button class="btn" data-copy>${t('copyBtn')}</button>
      </div>`;
  }
  html += `</div></div></div>`;
  const wrap = document.createElement('div');
  wrap.innerHTML = html;
  const node = wrap.firstElementChild;
  const pdfBtn = node.querySelector('[data-pdf]');
  const copyBtn = node.querySelector('[data-copy]');
  if (pdfBtn) pdfBtn.onclick = () => exportPDF(node);
  if (copyBtn) copyBtn.onclick = (ev) => copyAnswer(a, ev.target);
  inner.classList.remove('empty');
  inner.appendChild(node);
  if (a.chips && a.chips.length && !restore) setChips(a.chips);
  LAST_ANSWER = a;
  if (!restore) scrollBottom();
}

async function send(text){
  if (busy) return;
  if (!SETTINGS || !SETTINGS.ready) {
    openSettings(false);
    updateEnginePill();
    return;
  }
  const message = (text || $('input').value || '').trim();
  if (!message) return;
  busy = true;
  $('send').disabled = true;
  $('input').value = '';
  $('input').style.height = 'auto';
  addUser(message + (ATTACHMENT ? '\n▤ ' + ATTACHMENT.name : ''));
  addTyping();
  try {
    const {res, data} = await fetchJSON('/api/chat', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: SESSION, message, lang: LANG, role: currentRole(), web_search: webEnabled(), attachment_id: ATTACHMENT ? ATTACHMENT.id : ''})
    });
    removeTyping();
    if (!res.ok || data.error) {
      if (data.code === 'llm_required') {
        openSettings();
        updateEnginePill();
        renderError(LANG === 'zh' ? t('llmRequiredTitle') : t('llmRequiredTitle'), data.hint || t('llmRequiredBody'));
        return;
      }
      renderError(data.error || ('HTTP ' + res.status), data.hint);
      return;
    }
    renderAnswer(data);
    localStorage.setItem('openecrs-session', SESSION);
    refreshHistory();
  } catch (err) {
    removeTyping();
    const msg = err.name === 'AbortError'
      ? (LANG === 'zh' ? '请求超时（150 秒）。模型或网络较慢，请重试或检查设置。' : 'Request timed out after 150s. The model or network is slow; retry or check settings.')
      : (LANG === 'zh' ? '连不上本地智能体服务：' : 'Cannot reach the local agent service: ') + err.message;
    renderError(msg);
  } finally {
    busy = false;
    $('send').disabled = false;
    $('input').focus();
  }
}

async function exportPDF(cardNode){
  const note = cardNode ? cardNode.querySelector('[data-pdf]') : null;
  const prev = note ? note.textContent : '';
  if (note) { note.disabled = true; note.textContent = t('pdfGenerating'); }
  try {
    const res = await fetch('/api/pdf', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({session: SESSION, lang: LANG})
    });
    const ctype = res.headers.get('Content-Type') || '';
    if (ctype.includes('application/json')) {
      const data = await res.json();
      if (data.fallback) { window.open(data.fallback, '_blank'); return; }
      throw new Error(data.error || data.hint || (LANG === 'zh' ? 'PDF 生成失败' : 'PDF generation failed'));
    }
    const blob = await res.blob();
    const name = (res.headers.get('Content-Disposition') || '').match(/filename\*=UTF-8''([^;]+)/);
    const filename = name ? decodeURIComponent(name[1]) : t('fallbackFilename');
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (err) {
    alert(t('pdfFailed') + err.message);
  } finally {
    if (note) { note.disabled = false; note.textContent = prev || t('exportBrief'); }
  }
}

async function copyAnswer(a, btn){

  const old = btn.textContent;

let SIDEBAR_SCENARIOS = [];
let scenExpanded = false;

function renderScenarioList(){
  const scen = $('scen');
  if (!scen) return;
  scen.innerHTML = '';
  const list = scenExpanded ? SIDEBAR_SCENARIOS : SIDEBAR_SCENARIOS.slice(0, 5);
  list.forEach(s => {
    const name = LANG === 'zh' ? s.name : s.name_en;
    const b = document.createElement('button');
    b.title = name + ' · ' + Number(s.opportunity).toFixed(1);
    b.innerHTML = `<span class="rk">${s.rank || ''}</span><span class="nm">${esc(name)}</span><span class="sc">${Number(s.opportunity).toFixed(1)}</span>`;
    b.onclick = () => {
      closeNav();
      if (window.OCFeatures && window.OCFeatures.openDetail) window.OCFeatures.openDetail(s.id);
      else send(t('scenarioAsk', name));
    };
    scen.appendChild(b);
  });
  if (SIDEBAR_SCENARIOS.length > 5) {
    const more = document.createElement('button');
    more.className = 'scen-more';
    more.textContent = scenExpanded ? t('scenCollapse') : t('scenShowAll', SIDEBAR_SCENARIOS.length);
    more.onclick = () => { scenExpanded = !scenExpanded; renderScenarioList(); };
    scen.appendChild(more);
  }
}

async function loadSidebar(){
  try {
    const res = await fetch('/api/data');
    const data = await res.json();
    SIDEBAR_SCENARIOS = (data.scenarios || []).map(s => ({
      id: s.name, name: s.name, name_en: s.name_en || s.name, rank: s.rank,
      opportunity: s.opportunity, route: LANG === 'zh' ? s.route : (s.route_en || s.route)
    }));
    const meta = Object.assign({evidence_records: 15525, data_cutoff: '2026-11-20',
                                records_clean: 45306, high_conf_samples: 2848}, data.meta || {});
    const um = $('userMeta');
    if (um) um.textContent = `${Number(meta.evidence_records).toLocaleString()} ${t('statReviews')} · ${meta.data_cutoff}`;
    renderScenarioList();
    if (window.OCFeatures && window.OCFeatures.onScenarios && !window.__ocScenarioPushed) {
      try { window.OCFeatures.onScenarios(SIDEBAR_SCENARIOS); window.__ocScenarioPushed = true; } catch (e) {}
    }
  } catch (err) { /* keep static footer */ }
}

function openNav(){ $('app').classList.add('nav-open'); }
function closeNav(){ $('app').classList.remove('nav-open'); }

function switchLang(pref){
  localStorage.setItem('openecrs-lang-pref', pref);
  const url = new URL(location.href);
  if (pref === 'system') url.searchParams.delete('lang');
  else url.searchParams.set('lang', pref);
  url.searchParams.delete('q');
  location.replace(url.toString());
}

function setBackend(backend){
  CURRENT_BACKEND = backend === 'local' ? 'local' : 'api';
  document.querySelectorAll('#backendTabs button').forEach(b => b.classList.toggle('active', b.dataset.backend === CURRENT_BACKEND));
  $('apiPanel').hidden = CURRENT_BACKEND !== 'api';
  $('localPanel').hidden = CURRENT_BACKEND !== 'local';
}

function setSettingsTab(tab){
  document.querySelectorAll('#settingsTabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  $('settingsModelPanel').hidden = tab !== 'model';
  $('settingsPrefsPanel').hidden = tab !== 'prefs';
}

function openSettings(addNew){
  ADDING_PROFILE = !!addNew;
  EDITING_ID = ADDING_PROFILE ? null : (SETTINGS ? SETTINGS.active : null);
  fillSettingsForm();
  setSettingsTab('model');
  $('modal').hidden = false;
}
function closeSettings(){ $('modal').hidden = true; }

function fillSettingsForm(){
  if (SETTINGS) {
    CURRENT_BACKEND = ADDING_PROFILE ? 'api' : (SETTINGS.backend || 'api');
    $('fName').value = ADDING_PROFILE ? '' : (SETTINGS.name || '');
    $('fBase').value = SETTINGS.api.base_url || '';
    $('fModel').value = SETTINGS.api.model || '';
    $('fBaseModel').value = SETTINGS.local.base_model || '';
    $('fAdapter').value = SETTINGS.local.adapter || '';
    $('fKey').value = '';
    const hint = $('keyHint');
    if (SETTINGS.api.has_key && !ADDING_PROFILE) {
      const envNote = SETTINGS.api.key_source && SETTINGS.api.key_source.indexOf('env:') === 0 ? t('envNote') : '';
      hint.textContent = t('keySaved', SETTINGS.api.key_hint || '', envNote);
    } else {
      hint.textContent = t('keyMissing');
    }
  }
  setBackend(CURRENT_BACKEND);
  $('deleteProfile').hidden = ADDING_PROFILE || !SETTINGS || (SETTINGS.profiles || []).length <= 1;
  $('deleteProfile').textContent = t('deleteModel');
  const result = $('testResult');
  result.className = 'test-result';
  result.textContent = '';
}

function collectProfile(){
  const profile = {
    name: $('fName').value.trim(),
    backend: CURRENT_BACKEND,
    api: {base_url: $('fBase').value.trim(), model: $('fModel').value.trim()},
    local: {base_model: $('fBaseModel').value.trim(), adapter: $('fAdapter').value.trim()}
  };
  if (!ADDING_PROFILE && EDITING_ID) profile.id = EDITING_ID;
  const key = $('fKey').value.trim();
  if (key) profile.api.api_key = key;
  return profile;
}

async function saveSettings(){
  const result = $('testResult');
  result.className = 'test-result';
  result.textContent = t('saving');
  try {
    const res = await fetch('/api/settings', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profile: collectProfile()})});
    const data = await res.json();
    if (!res.ok || data.error) {
      result.className = 'test-result err';
      result.textContent = t('saveFailed', data.error || res.status);
      return;
    }
    SETTINGS = data;
    updateEnginePill();
    fillSettingsForm();
    result.className = SETTINGS.ready ? 'test-result ok' : 'test-result err';
    result.textContent = SETTINGS.ready ? t('saved') : t('saveFailed', SETTINGS.ready_detail || '');
    if (SETTINGS.ready) setTimeout(closeSettings, 350);
  } catch (err) {
    result.className = 'test-result err';
    result.textContent = t('saveFailed', err.message);
  }
}

async function deleteCurrentProfile(){
  if (!EDITING_ID) return;
  if (!confirm(t('deleteConfirm'))) return;
  try {
    const res = await fetch('/api/settings', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({delete_profile: EDITING_ID})});
    const data = await res.json();
    if (!res.ok || data.error) { alert(t('saveFailed', data.error || res.status)); return; }
    SETTINGS = data;
    updateEnginePill();
    closeSettings();
  } catch (err) { alert(t('saveFailed', err.message)); }
}

async function testAPI(){
  const result = $('testResult');
  result.className = 'test-result';
  result.textContent = t('testing');
  try {
    const res = await fetch('/api/test', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({profile: collectProfile()})});
    const data = await res.json();
    if (data.ok) {
      result.className = 'test-result ok';
      result.textContent = t('testOk', data);
    } else {
      result.className = 'test-result err';
      result.textContent = t('testFail', data.error);
    }
  } catch (err) {
    result.className = 'test-result err';
    result.textContent = t('testFail', err.message);
  }
}

async function loadSettings(){

    SETTINGS = await res.json();
    updateEnginePill();

    <div class="card"><div class="reply" style="margin:0;color:var(--ink)">${esc(text)}</div></div></div>`;

let historyTimer = null;

async function refreshHistory(){
  try {
    const q = ($('historySearch') && $('historySearch').value || '').trim();
    const res = await fetch('/api/sessions' + (q ? '?q=' + encodeURIComponent(q) : ''));
    const data = await res.json();
    const box = $('history');
    box.innerHTML = '';
    const items = data.sessions || [];
    if (!items.length) {
      box.innerHTML = `<div class="side-empty">${t(q ? 'noResults' : 'noHistory')}</div>`;
      return;
    }
    items.slice(0, 12).forEach(item => {
      const row = document.createElement('div');
      row.className = 'history-row' + (item.id === SESSION ? ' active' : '');
      const main = document.createElement('button');
      main.className = 'h-main';
      main.textContent = item.title || item.preview || item.id.slice(0, 8);
      main.title = item.title || '';
      main.onclick = () => loadSession(item.id);
      const ren = document.createElement('button');
      ren.className = 'h-act'; ren.textContent = '✎'; ren.title = t('rename');
      ren.onclick = (ev) => { ev.stopPropagation(); renameSession(item.id, item.title || ''); };
      const del = document.createElement('button');
      del.className = 'h-act'; del.textContent = '×'; del.title = t('delete');
      del.onclick = (ev) => { ev.stopPropagation(); deleteSession(item.id); };
      row.appendChild(main); row.appendChild(ren); row.appendChild(del);
      box.appendChild(row);
    });
  } catch (err) { /* ignore */ }
}

async function renameSession(sid, current){
  const title = prompt(t('renamePrompt'), current || '');
  if (!title || !title.trim()) return;
  try {
    await fetch('/api/session/rename', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({sid, title: title.trim()})});
    refreshHistory();
  } catch (err) { showToast(t('saveFailed', err.message)); }
}

async function deleteSession(sid){
  if (!confirm(t('deletePrompt'))) return;
  try {
    await fetch('/api/session?sid=' + encodeURIComponent(sid), {method: 'DELETE'});
    if (sid === SESSION) {
      SESSION = (crypto.randomUUID ? crypto.randomUUID() : 's-' + Date.now());
      localStorage.setItem('openecrs-session', SESSION);
      inner.innerHTML = '';
      welcome();
    }
    refreshHistory();
  } catch (err) { showToast(t('saveFailed', err.message)); }
}

async function loadSession(sid){
  try {
    const res = await fetch('/api/session?sid=' + encodeURIComponent(sid));
    if (!res.ok) return;
    const data = await res.json();
    SESSION = sid;
    localStorage.setItem('openecrs-session', sid);
    inner.innerHTML = '';
    inner.classList.remove('empty');
    const messages = data.messages || [];
    messages.forEach(m => {
      if (m.role === 'user') addUser(m.content);
      else if (m.answer) renderAnswer(m.answer, true);
      else renderSimpleAssistant(m.content);
    });
    if (!messages.length) welcome();
    LAST_ANSWER = null;
    for (let i = messages.length - 1; i >= 0; i -= 1) {
      if (messages[i].role === 'assistant' && messages[i].answer) { LAST_ANSWER = messages[i].answer; break; }
    }
    thread.scrollTop = thread.scrollHeight;
    closeNav();
    refreshHistory();
  } catch (err) { /* ignore */ }
}

async function restoreSession(){
  try {
    const res = await fetch('/api/session?sid=' + encodeURIComponent(SESSION));
    if (!res.ok) { welcome(); return; }
    const data = await res.json();
    if (!data.messages || !data.messages.length) { welcome(); return; }
    inner.innerHTML = '';
    data.messages.forEach(m => {
      if (m.role === 'user') addUser(m.content);
      else if (m.answer) renderAnswer(m.answer, true);
      else renderSimpleAssistant(m.content);
    });
    for (let i = data.messages.length - 1; i >= 0; i -= 1) {
      if (data.messages[i].role === 'assistant' && data.messages[i].answer) { LAST_ANSWER = data.messages[i].answer; break; }
    }
    thread.scrollTop = thread.scrollHeight;
  } catch (err) { welcome(); }
}

function renderAttachment(){
  const chip = $('attachChip');
  if (!chip) return;
  if (!ATTACHMENT) { chip.hidden = true; return; }
  chip.hidden = false;
  $('attachName').textContent = ATTACHMENT.name;
  $('attachMeta').textContent = (ATTACHMENT.mode === 'rag' ? 'RAG' : 'Light') + ' · ' + (ATTACHMENT.tokens || 0) + ' tokens';
}

async function uploadFile(file){
  if (!file) return;
  showToast(t('attachReading'));
  try {
    const data = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => reject(reader.error || new Error('read failed'));
      reader.readAsDataURL(file);
    });
    const res = await fetch('/api/upload', {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: file.name, data})});
    const payload = await res.json();
    if (!res.ok || payload.error) throw new Error(payload.error || res.status);
    ATTACHMENT = payload;
    renderAttachment();
    showToast(t('attachReady', payload.name, payload.mode === 'rag' ? 'RAG' : 'Light'));
  } catch (err) {
    showToast(t('attachError') + (err.message || err));
  } finally {
    if ($('fileInput')) $('fileInput').value = '';
  }
}

function webEnabled(){
  return localStorage.getItem('openecrs-web') === '1';
}

function syncWebUI(){
  const on = webEnabled();
  const btn = $('webBtn');
  if (btn) {
    btn.classList.toggle('on', on);
    btn.title = t('webTitle') + ': ' + (on ? t('webOn') : t('webOff'));
  }
  if ($('webBtnLabel')) $('webBtnLabel').textContent = on ? t('webOn') : t('webOff');
  if ($('webToggle')) $('webToggle').checked = on;
}

function setWebEnabled(on){
  localStorage.setItem('openecrs-web', on ? '1' : '0');
  syncWebUI();
  showToast(on ? t('webEnabledToast') : t('webDisabledToast'));
}

const TOUR_STEPS = [
  {title: t('tour1Title'), body: t('tour1Body')},
  {title: t('tour2Title'), body: t('tour2Body')},
  {title: t('tour3Title'), body: t('tour3Body')},
  {title: t('tour4Title'), body: t('tour4Body')}
];
let tourIndex = 0;

function updateTour(){
  const step = TOUR_STEPS[tourIndex];
  $('tourStep').textContent = (tourIndex + 1) + ' / ' + TOUR_STEPS.length;
  $('tourTitle').textContent = step.title;
  $('tourBody').textContent = step.body;
  $('tourPrev').textContent = t('tourPrev');
  $('tourPrev').disabled = tourIndex === 0;
  $('tourNext').textContent = tourIndex === TOUR_STEPS.length - 1 ? t('tourDone') : t('tourNext');
  $('tourSkip').textContent = t('tourSkip');
}

function showTour(index){
  tourIndex = Math.max(0, Math.min(TOUR_STEPS.length - 1, index || 0));
  updateTour();
  $('tour').hidden = false;
}

function hideTour(){
  $('tour').hidden = true;
  localStorage.setItem('openecrs-tour-v1', 'done');
}

function mountFeatures(){
  const ctx = {
    t: (key, ...args) => t(key, ...args),
    lang: LANG,
    esc,
    getRole: currentRole,
    getScenarios: () => SIDEBAR_SCENARIOS,
    openChat: (prompt) => { closeNav(); send(prompt); },
    notify: (text) => showToast(text)
  };
  if (window.OCFeatures && typeof window.OCFeatures.mount === 'function') {
    try { window.OCFeatures.mount(ctx); } catch (err) { console.warn('feature mount failed', err); }
    return;
  }
  if (!window.__ocFeatureTries) window.__ocFeatureTries = 0;
  window.__ocFeatureTries += 1;
  if (window.__ocFeatureTries < 80) setTimeout(mountFeatures, 120);
}
